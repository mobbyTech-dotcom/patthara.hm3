{% extends 'base.html' %}
{% block title %}สั่งซื้อ - ภัทรา Homemade{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-amber-800">🛒 สั่งซื้อสินค้า</h1>
        <a href="{% url 'index' %}" class="text-sm text-amber-600 hover:underline">← กลับหน้าร้าน</a>
    </div>

    <div id="cart-container" class="bg-white rounded-2xl shadow-sm p-5 mb-6 hidden">
        <h2 class="font-bold text-gray-700 mb-4 text-lg">รายการสินค้าที่เลือก</h2>
        <div id="dynamic-cart-items" class="space-y-4"></div>
        <div class="border-t mt-4 pt-4 flex justify-between font-bold text-amber-800 text-xl">
            <span>ยอดรวมทั้งสิ้น</span>
            <span id="cart-total">฿0</span>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-5 mb-6">
        <h2 class="font-bold text-gray-700 mb-4 text-lg">📋 ข้อมูลการสั่งซื้อ</h2>
        <div class="space-y-3">
            <input type="text" id="customer_name" placeholder="ชื่อ-นามสกุล *"
                   class="w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
            <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์ *"
                   class="w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
            <textarea id="address" placeholder="ที่อยู่ *" rows="3"
                      class="w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none"></textarea>
            <div>
                <label class="block text-xs text-gray-500 mb-1">วันนัดรับ *</label>
                <input type="date" id="appointment_date"
                       class="w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none">
            </div>
            <textarea id="note" placeholder="หมายเหตุเพิ่มเติม (ไม่บังคับ)" rows="2"
                      class="w-full border rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none"></textarea>
        </div>
    </div>

    <button onclick="submitOrder()"
            class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-2xl text-lg transition shadow-md">
        📄 ยืนยันและดูใบออเดอร์
    </button>
</div>

<script>
const productsData = {{ products_json|safe }};
let cart = {};
try { cart = JSON.parse(sessionStorage.getItem('patthara_cart') || '{}'); } catch(e) {}

function calculateCart() {
    // นับจำนวนรวมต่อสินค้า (รวมทุก SKU) เพื่อตรวจโปร
    const productCounts = {};
    Object.values(cart).forEach(item => {
        if (item.qty > 0) {
            productCounts[item.productId] = (productCounts[item.productId] || 0) + item.qty;
        }
    });

    let total = 0;
    const finalItems = [];

    Object.entries(cart).forEach(([skuId, item]) => {
        if (item.qty <= 0) return;

        let currentPrice = item.price;
        let hasDiscount  = false;
        const pData      = productsData[item.productId];

        // ตรวจโปรโมชั่น
        if (pData && pData.promos && pData.promos.length > 0) {
            const totalQty = productCounts[item.productId];
            for (const promo of pData.promos) {
                if (totalQty >= promo.min_quantity) {
                    currentPrice = promo.special_price;
                    hasDiscount  = true;
                    break;
                }
            }
        }

        total += currentPrice * item.qty;
        finalItems.push({
            skuId,
            productId:     item.productId,
            name:          `${pData ? pData.name : ''} (${item.skuName})`,
            price:         currentPrice,
            qty:           item.qty,
            originalPrice: item.price,
            hasDiscount,
        });
    });

    return { total, finalItems };
}

function renderCart() {
    const { total, finalItems } = calculateCart();
    const container = document.getElementById('cart-container');
    const itemsDiv  = document.getElementById('dynamic-cart-items');

    if (finalItems.length === 0) { container.classList.add('hidden'); return; }
    container.classList.remove('hidden');
    document.getElementById('cart-total').textContent = '฿' + total.toLocaleString();

    itemsDiv.innerHTML = finalItems.map(item => {
        const pData   = productsData[item.productId];
        const imgHtml = pData && pData.image
            ? `<img src="${pData.image}" class="w-14 h-14 object-cover rounded-lg flex-shrink-0">`
            : `<div class="w-14 h-14 bg-amber-100 rounded-lg flex items-center justify-center text-2xl flex-shrink-0">🧁</div>`;
        const priceHtml = item.hasDiscount
            ? `<span class="line-through text-gray-400 text-xs mr-1">฿${item.originalPrice}</span><span class="text-green-600 font-bold">฿${item.price}</span> <span class="text-xs text-green-600 bg-green-100 px-1.5 py-0.5 rounded ml-1">ราคาโปร!</span>`
            : `<span class="text-amber-700 font-bold">฿${item.price}</span>`;

        return `
        <div class="flex items-center gap-3 border rounded-xl p-3">
            ${imgHtml}
            <div class="flex-1">
                <p class="font-semibold text-gray-800 text-sm">${item.name}</p>
                <div class="text-sm mt-1">${priceHtml}</div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="changeQty('${item.skuId}', -1)"
                        class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 font-bold text-lg flex items-center justify-center">−</button>
                <span class="w-6 text-center font-bold text-gray-800">${item.qty}</span>
                <button onclick="changeQty('${item.skuId}', 1)"
                        class="w-8 h-8 rounded-full bg-amber-500 hover:bg-amber-600 text-white font-bold text-lg flex items-center justify-center">+</button>
            </div>
        </div>`;
    }).join('');
}

function changeQty(skuId, delta) {
    if (cart[skuId]) {
        cart[skuId].qty += delta;
        if (cart[skuId].qty <= 0) delete cart[skuId];
        sessionStorage.setItem('patthara_cart', JSON.stringify(cart));
        renderCart();
    }
}

async function submitOrder() {
    const { total, finalItems } = calculateCart();
    if (finalItems.length === 0) return alert('กรุณาเลือกสินค้าก่อนยืนยันออเดอร์');

    const name    = document.getElementById('customer_name').value.trim();
    const phone   = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const date    = document.getElementById('appointment_date').value;
    const note    = document.getElementById('note').value.trim();

    if (!name || !phone || !address || !date)
        return alert('กรุณากรอกข้อมูลให้ครบ (ชื่อ, เบอร์โทร, ที่อยู่, วันนัดรับ)');

    const items = finalItems.map(i => ({ name: i.name, price: i.price, quantity: i.qty }));

    const res = await fetch('/order/create/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: JSON.stringify({ customer_name: name, phone, address, appointment_date: date, note, total, items })
    });
    const data = await res.json();
    if (data.success) {
        sessionStorage.removeItem('patthara_cart');
        window.location.href = '/order/receipt/' + data.order_id + '/';
    } else {
        alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
    }
}

renderCart();
</script>
{% endblock %}
